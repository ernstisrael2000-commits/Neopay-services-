<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title data-seo-title>Rena Services | Services numériques en Haïti</title>

    <!-- Primary SEO -->
    <meta data-seo-description name="description" content="Rena Services réunit recharges de jeux, abonnements, paiements, suivi de colis, expédition et formations en ligne pour la clientèle en Haïti." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Rena" />
    <link rel="canonical" href="https://renaservices.shop/" />

    <!-- PWA / App Meta -->
    <meta name="theme-color" content="#1d4ed8" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rena" />
    <meta name="application-name" content="Rena" />
    <meta name="msapplication-TileColor" content="#1d4ed8" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Rena Services" />
    <meta property="og:locale" content="fr_HT" />
    <meta data-seo-og-title property="og:title" content="Rena Services | Services numériques en Haïti" />
    <meta data-seo-og-description property="og:description" content="Recharges, abonnements, paiements, suivi de colis, expédition et formations en ligne en Haïti." />
    <meta data-seo-og-url property="og:url" content="https://renaservices.shop/" />
    <meta property="og:image" content="https://renaservices.shop/logo.png" />
    <meta property="og:image:alt" content="Logo Rena Services" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta data-seo-twitter-title name="twitter:title" content="Rena Services | Services numériques en Haïti" />
    <meta data-seo-twitter-description name="twitter:description" content="Recharges, abonnements, paiements, suivi de colis, expédition et formations en ligne en Haïti." />
    <meta name="twitter:image" content="https://renaservices.shop/logo.png" />

    <!-- Performance: preconnect to critical origins -->
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="dns-prefetch" href="https://firestore.googleapis.com" />
    <link rel="dns-prefetch" href="https://storage.googleapis.com" />

    <!--
      Fonts — loaded as <link> (non-blocking) instead of CSS @import (render-blocking).
      Preconnect to both fonts.googleapis.com and fonts.gstatic.com to remove
      the round-trip DNS lookup latency before the font files start downloading.
      display=swap prevents FOIT; the font-face fallback reduces CLS on swap.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />

    <!-- Structured data is kept in the static document for search crawlers. -->
    <script id="seo-structured-data" type="application/ld+json">[{"@context":"https://schema.org","@type":"Organization","name":"Rena Services","url":"https://renaservices.shop","logo":"https://renaservices.shop/logo.png","description":"Services numériques, logistique, suivi de colis, expédition et formations en ligne en Haïti.","contactPoint":{"@type":"ContactPoint","telephone":"+50944813185","contactType":"customer service","availableLanguage":["fr","ht"]}},{"@context":"https://schema.org","@type":"WebSite","name":"Rena Services","url":"https://renaservices.shop","inLanguage":"fr-HT"}]</script>
  </head>
  <body>
    <div id="root"></div>
    <!-- seo-fallback is populated by the production server for crawlers without JavaScript. -->
    <!-- seo-fallback -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
